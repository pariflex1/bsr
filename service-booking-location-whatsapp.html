<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#17221c; --muted:#66746b; --paper:#f3f4f6; --line:#e2e4e8; --green:#0861F2; --green-dark:#064fc4; --green-tint:#eef4ff; --red:#c4261d; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--paper); color:var(--ink); display:flex; justify-content:center; font-size:15px; line-height:1.4; }
  .container { width:100%; max-width:520px; height:100dvh; padding:0 16px 80px; display:flex; flex-direction:column; overflow-y:auto; }
  h1 { font-size:24px; font-weight:600; letter-spacing:-.5px; line-height:1.25; padding:20px 0 14px; }
  .step { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; min-height:24px; }
  .step h2 { font-size:14px; font-weight:600; letter-spacing:.1px; }
  .count { font-size:12px; font-weight:500; color:var(--green-dark); background:var(--green-tint); padding:2px 9px; border-radius:100px; opacity:0; transition:opacity .2s; }
  .count.show { opacity:1; }

  /* Service tabs with price */
  .services { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .tab { display:flex; align-items:center; gap:11px; width:100%; min-height:60px; padding:10px 14px; background:#fff; border:1.5px solid var(--line); border-radius:14px; text-align:left; font:inherit; color:inherit; cursor:pointer; transition:background .15s,border-color .15s,color .15s,transform .1s; }
  .tab:active { transform:scale(.98); }
  .tab svg { flex:none; width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .tab b { display:block; font-size:15px; font-weight:600; line-height:1.3; letter-spacing:-.1px; }
  .tab small { display:block; font-size:11.5px; color:var(--green-dark); font-weight:400; margin-top:4px; line-height:1.3; }
  .tab.on { background:var(--green); border-color:var(--green); color:#fff; }
  .tab.on small { color:#fff; }
  .tab:focus-visible, button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .note { font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:10px; }
  .err { font-size:12px; color:var(--red); margin-top:5px; display:none; }
  .err.show { display:block; }

  /* Address */
  .addr-section { margin-top:18px; }
  .addr-input { width:100%; display:block; padding:12px 14px; line-height:1.5; border:1.5px solid var(--line); border-radius:12px; font:inherit; font-size:16px; color:var(--ink); background:#fff; outline:none; resize:none; transition:border-color .15s; }
  .addr-input:focus { border-color:var(--ink); }
  .addr-input.error { border-color:var(--red); }
  .loc-btn { margin-top:10px; width:100%; min-height:40px; padding:6px 14px; display:flex; align-items:center; justify-content:center; gap:8px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font:inherit; font-size:14px; font-weight:500; cursor:pointer; }
  .loc-btn:active { background:#eceee9; }
  .loc-btn.loading { pointer-events:none; opacity:.75; }
  .loc-btn svg { width:18px; height:18px; }
  .spin { width:16px; height:16px; border:2px solid var(--ink); border-top-color:transparent; border-radius:50%; animation:rotate .6s linear infinite; }
  @keyframes rotate { to { transform:rotate(360deg); } }

  /* Bottom bar */
  .bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:rgba(243,244,246,.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; gap:10px; }
  .call-link { flex:none; width:48px; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--line); border-radius:12px; color:var(--ink); background:#fff; }
  .call-link svg { width:20px; height:20px; }
  .submit-btn { flex:1; min-height:48px; background:var(--green); color:#fff; border:none; border-radius:12px; font:inherit; font-size:15px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .submit-btn:active { background:var(--green-dark); }
  .submit-btn svg { width:18px; height:18px; }

  /* Option sheet */
  .sheet-bg { position:fixed; inset:0; background:rgba(10,20,14,.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; }
  .sheet { position:fixed; bottom:0; left:50%; width:100%; max-width:520px; transform:translate(-50%,105%); background:#fff; border-radius:20px 20px 0 0; padding:18px 16px calc(16px + env(safe-area-inset-bottom)); transition:transform .25s ease; z-index:51; }
  .open .sheet-bg { opacity:1; pointer-events:auto; }
  .open .sheet { transform:translate(-50%,0); }
  .sheet h3 { font-size:18px; font-weight:600; letter-spacing:-.3px; }
  .sheet p { font-size:13px; color:var(--muted); margin-top:3px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .opt { padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:#fff; font:inherit; text-align:left; cursor:pointer; }
  .opt b { display:block; font-size:14px; font-weight:500; }
  .opt span { font-size:13px; color:var(--green-dark); font-weight:500; }
  .opt.on { background:var(--green); border-color:var(--green); color:#fff; }
  .opt.on span { color:#fff; }
  .opt em { display:block; font-style:normal; font-size:12px; color:var(--muted); margin-top:2px; }
  .opt.on em { color:#fff; }
  .tab:last-child:nth-child(odd) { grid-column:1 / -1; }
  .qty { display:flex; align-items:center; justify-content:center; gap:22px; margin-top:14px; }
  .qty button { width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line); background:#fff; font-size:22px; cursor:pointer; color:var(--ink); }
  .qty div { min-width:110px; text-align:center; font-size:22px; font-weight:600; }
  .qty small { display:block; font-size:12px; font-weight:400; color:var(--muted); }
  .sh-total { margin-top:14px; padding:10px 12px; background:var(--green-tint); border-radius:12px; display:flex; justify-content:space-between; font-size:14px; }
  .sh-total b { font-weight:600; color:var(--green-dark); }
  .sh-act { display:flex; gap:10px; margin-top:12px; }
  .sh-act button { min-height:46px; border-radius:12px; font:inherit; font-size:15px; font-weight:500; cursor:pointer; }
  #shRm { flex:none; padding:0 18px; background:#fff; border:1.5px solid var(--line); color:var(--red); }
  #shOk { flex:1; background:var(--green); border:none; color:#fff; }

  .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-140px); background:var(--ink); color:#fff; padding:10px 20px; border-radius:12px; font-size:14px; font-weight:500; z-index:999; transition:transform .3s ease; max-width:90%; text-align:center; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.bad { background:var(--red); }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation-duration:0s !important; } }
</style>
</head>
<body>
<div class="container">
  <h1>Book a Service</h1>

  <div class="step"><h2>Select services &amp; see rates</h2><span class="count" id="count"></span></div>
  <div class="services" id="services"></div>
  <div class="err" id="tabErr" role="alert">Please select at least one service</div>
  <p class="note">Starting rates. Parts extra. Final price confirmed after inspection.</p>

  <div class="addr-section">
    <div class="step"><h2>Your address</h2></div>
    <textarea class="addr-input" id="addr" placeholder="House no., street, area, city" rows="2" aria-label="Your address"></textarea>
    <div class="err" id="addrErr" role="alert">Please enter your address</div>
    <button class="loc-btn" id="locBtn" type="button" onclick="getLoc()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"/></svg>
      <span id="locLabel">Use my current location</span>
    </button>
    <!-- Hidden location fields: populated only after location permission succeeds -->
    <input type="hidden" id="latitude"><input type="hidden" id="longitude"><input type="hidden" id="locationAccuracy">
  </div>
</div>

<div class="bar">
  <a href="tel:+919267001374" class="call-link" aria-label="Call us">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
  </a>
  <button class="submit-btn" type="button" onclick="send()">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    Send on WhatsApp
  </button>
</div>

<div id="sheetWrap">
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <h3 id="shT"></h3><p id="shD"></p>
    <div id="shB"></div>
    <div class="sh-total"><span>Estimated price</span><b id="shTot"></b></div>
    <div class="sh-act"><button id="shRm" type="button" onclick="removeSvc()">Remove</button><button id="shOk" type="button" onclick="confirmSvc()">Add</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // Rates from the rate list. type: opts = choose a size/option, qty = per-unit rate, fix = starting visit rate
  const SERVICES = [
    { id:'tank', name:'Water Tank', full:'Water Tank Cleaning', type:'grid', from:'From ₹399',
      desc:'Cleaning, sludge removal, sanitization. Zero-human entry technology.',
      rows:['500 Litres','750 Litres','1,000 Litres'], table:[[399,699,899,1199,1499],[499,899,1199,1599,1999],[599,1099,1499,1999,2499]], min:1, max:5, step:1, def:1,
      icon:'<rect x="5" y="4" width="14" height="16" rx="3"/><path d="M5 10h14M8.5 15c1 1 2 1 3 0s2-1 3 0"/>' },
    { id:'solar', name:'Solar AMC', full:'Solar Panel AMC (12 visits / year)', type:'opts', from:'From ₹499 / month',
      desc:'High-pressure washing and maintenance. Free 1,000 L tank cleaning once a year.',
      opts:[['6 to 8 panels',5988,0,' / year','₹499 / month'],['9 to 11 panels',8388,0,' / year','₹699 / month'],['12 to 14 panels',10788,0,' / year','₹899 / month'],['15 to 20 panels',11988,0,' / year','₹999 / month']],
      icon:'<path d="M3 9h18l-2 9H5z"/><path d="M9.5 9L9 18M14.5 9l.5 9M4 13.5h16M12 3v2M5.5 4.5L7 6M18.5 4.5L17 6"/>' },
    { id:'sofa', name:'Sofa Cleaning', full:'Sofa & Fabric Cleaning', type:'qty', from:'₹200 / seat',
      desc:'Foam wash, vacuum extraction, stain removal and sanitization.', rate:200, unit:'seat', units:'seats', step:1, min:1, def:5,
      icon:'<path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v5H3zM6 18v2M18 18v2"/>' },
    { id:'bath', name:'Bathroom', full:'Bathroom Deep Cleaning', type:'opts', from:'From ₹499',
      desc:'Acid-free tile and sanitary shine, scaling removal and sanitization.',
      opts:[['Regular bathroom',499,0,' / bathroom'],['Attached toilet / bathroom',599,0,' / bathroom']],
      icon:'<path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM6 12V6.5a2.5 2.5 0 0 1 4.5-1.5M7 19l-1 2M17 19l1 2"/>' },
    { id:'car', name:'Car Wash', full:'Car Washing (Door Service)', type:'opts', from:'From ₹399',
      desc:'Exterior and interior cleaning, with optional polish.',
      opts:[['Car Wash',399],['Wash + Polish',599]],
      icon:'<path d="M4 15l1.6-4.8A2 2 0 0 1 7.5 8.8h9a2 2 0 0 1 1.9 1.4L20 15v3H4z"/><path d="M6.5 18v2M17.5 18v2M4 13h16"/>' },
    { id:'wp', name:'Waterproofing', full:'Waterproofing', type:'qty', from:'₹35 / sq ft',
      desc:'Roof, wall, basement and bathroom. 10 years warranty.', rate:35, unit:'sq ft', units:'sq ft', step:50, min:50, def:100,
      icon:'<path d="M3 11l9-7 9 7M5 10v10h14V10"/><path d="M12 12.5c1.5 2 2.2 3 2.2 4a2.2 2.2 0 0 1-4.4 0c0-1 .7-2 2.2-4z"/>' },
    { id:'plumb', name:'Plumbing', full:'Plumbing Services', type:'fix', from:'Visit ₹500+', price:500,
      desc:'Pipeline connection, leakage repair, motor, tank and pipe fitting.',
      icon:'<path d="M4 8h8a3 3 0 0 1 3 3v9M4 5v6M12 20h6"/>' },
    { id:'elec', name:'Electrical', full:'Electrical Services', type:'qty', from:'₹500 / point+', plus:1,
      desc:'Fittings, MCB/DB installation, short-circuit and fault repair.', rate:500, unit:'point', units:'points', step:1, min:1, def:1,
      icon:'<path d="M13 3L5 13.5h6L10 21l9-11h-6z"/>' },
    { id:'fit', name:'Fitting & Install', full:'Fitting & Installation Services', type:'fix', from:'Visit ₹500+', price:500,
      desc:'Kitchen fitting, repairs, installation and aluminium fittings.',
      icon:'<path d="M5 19l9-9M13 5l6 6-2 2-6-6z"/>' }
  ];
  const sel = {};      // id -> { opt, qty }
  let cur = null;      // service open in the sheet
  const inr = n => '₹' + n.toLocaleString('en-IN');

  function calc(s, v) {
    if (s.type === 'opts') { const o = s.opts[v.opt]; return { total:o[1], plus:!!o[2], suffix:o[3]||'', label:o[0] }; }
    if (s.type === 'grid') return { total:s.table[v.opt][v.qty-1], plus:false, suffix:'', label:s.rows[v.opt] + ' × ' + v.qty + (v.qty === 1 ? ' tank' : ' tanks') };
    if (s.type === 'qty')  return { total:s.rate * v.qty, plus:!!s.plus, suffix:'', label:v.qty + ' ' + (v.qty === 1 ? s.unit : s.units) };
    return { total:s.price, plus:true, suffix:'', label:'Visit' };
  }
  const priceText = (s, v) => { const c = calc(s, v); return c.label + ' · ' + inr(c.total) + (c.plus ? '+' : '') + c.suffix; };

  function render() {
    const box = document.getElementById('services');
    box.innerHTML = '';
    SERVICES.forEach(s => {
      const on = !!sel[s.id];
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tab' + (on ? ' on' : ''); b.setAttribute('aria-pressed', on);
      b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${s.icon}</svg><span><b>${s.name}</b><small>${on && s.type !== 'fix' ? priceText(s, sel[s.id]) : s.from}</small></span>`;
      b.onclick = () => tapSvc(s);
      box.appendChild(b);
    });
    const ids = Object.keys(sel), c = document.getElementById('count');
    let total = 0; ids.forEach(id => { const s = SERVICES.find(x => x.id === id); total += calc(s, sel[id]).total; });
    c.textContent = ids.length + ' selected · est. ' + inr(total) + '+';
    c.classList.toggle('show', ids.length > 0);
    if (ids.length) document.getElementById('tabErr').classList.remove('show');
  }

  function tapSvc(s) {
    if (s.type === 'fix') { if (sel[s.id]) delete sel[s.id]; else sel[s.id] = {}; render(); return; }
    cur = s;
    const v = sel[s.id] || { opt: 0, qty: s.def };
    cur.draft = { opt: v.opt, qty: v.qty };
    document.getElementById('shT').textContent = s.full;
    document.getElementById('shD').textContent = s.desc;
    document.getElementById('shRm').style.display = sel[s.id] ? '' : 'none';
    document.getElementById('shOk').textContent = sel[s.id] ? 'Update' : 'Add service';
    drawSheet();
    document.getElementById('sheetWrap').classList.add('open');
  }

  function drawSheet() {
    const s = cur, d = s.draft, b = document.getElementById('shB'); let h = '';
    if (s.type === 'opts') {
      h = '<div class="opts">' + s.opts.map((o, i) =>
        `<button type="button" class="opt${i === d.opt ? ' on' : ''}" onclick="setOpt(${i})"><b>${o[0]}</b><span>${inr(o[1])}${o[2] ? ' onwards' : ''}${o[3] || ''}</span>${o[4] ? `<em>${o[4]}</em>` : ''}</button>`).join('') + '</div>';
    } else if (s.type === 'grid') {
      h = '<div class="opts">' + s.rows.map((r, i) =>
        `<button type="button" class="opt${i === d.opt ? ' on' : ''}" onclick="setOpt(${i})"><b>${r}</b><span>${inr(s.table[i][d.qty - 1])}</span></button>`).join('') + '</div>';
    }
    if (s.type === 'qty' || s.type === 'grid') {
      const sub = s.type === 'grid' ? (d.qty === 1 ? 'tank' : 'tanks') : `${d.qty === 1 ? s.unit : s.units} × ${inr(s.rate)}`;
      h += `<div class="qty"><button type="button" aria-label="Decrease" onclick="chg(-1)">−</button><div>${d.qty}<small>${sub}</small></div><button type="button" aria-label="Increase" onclick="chg(1)">+</button></div>`;
    }
    b.innerHTML = h;
    const c = calc(s, d);
    document.getElementById('shTot').textContent = inr(c.total) + (c.plus ? ' onwards' : '') + c.suffix;
  }
  function setOpt(i) { cur.draft.opt = i; drawSheet(); }
  function chg(dir) { cur.draft.qty = Math.min(cur.max || 9999, Math.max(cur.min, cur.draft.qty + dir * cur.step)); drawSheet(); }
  function preselect(id) { const s = SERVICES.find(x => x.id === id); if (!s) return; if (!sel[id]) sel[id] = { opt: 0, qty: s.def }; render(); }
  function confirmSvc() { sel[cur.id] = { opt: cur.draft.opt, qty: cur.draft.qty }; closeSheet(); render(); }
  function removeSvc() { delete sel[cur.id]; closeSheet(); render(); }
  function closeSheet() { document.getElementById('sheetWrap').classList.remove('open'); }

  function setHiddenLocation(lat = '', lng = '', accuracy = '') {
    document.getElementById('latitude').value = lat;
    document.getElementById('longitude').value = lng;
    document.getElementById('locationAccuracy').value = accuracy;
  }

  function getLoc() {
    const btn = document.getElementById('locBtn'), svg = btn.querySelector('svg'), label = document.getElementById('locLabel');
    if (!navigator.geolocation) { msg('Location is not supported by this browser', true); return; }
    if (!window.isSecureContext) { msg('Location requires HTTPS or localhost', true); return; }
    btn.classList.add('loading'); svg.style.display = 'none'; label.textContent = 'Finding your location…';
    const s = document.createElement('div'); s.className = 'spin'; s.id = 'sp'; btn.prepend(s);

    navigator.geolocation.getCurrentPosition(
      async (p) => {
        const lat = p.coords.latitude, lng = p.coords.longitude, accuracy = Math.round(p.coords.accuracy);
        setHiddenLocation(lat, lng, accuracy);
        try {
          const url = `https://nominatim.openstreetmap.org/reverse?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&format=jsonv2`;
          const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (!response.ok) throw new Error('Address lookup failed');
          const data = await response.json();
          document.getElementById('addr').value = data.display_name || `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        } catch {
          document.getElementById('addr').value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        }
        document.getElementById('addr').classList.remove('error');
        document.getElementById('addrErr').classList.remove('show');
        msg(`Location captured (accuracy about ${accuracy} m)`, false);
        done('Update my location');
      },
      (error) => {
        setHiddenLocation();
        const messages = { 1: 'Location permission denied. Allow location access and try again.', 2: 'Location unavailable. Please enable device location services.', 3: 'Location timed out. Please try again.' };
        msg(messages[error.code] || 'Could not get location', true);
        done('Use my current location');
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );

    function done(text) {
      const sp = document.getElementById('sp'); if (sp) sp.remove();
      svg.style.display = ''; label.textContent = text; btn.classList.remove('loading');
    }
  }

  function send() {
    const ids = SERVICES.filter(s => sel[s.id]);
    const addrEl = document.getElementById('addr'), addr = addrEl.value.trim();
    let ok = true;
    if (!ids.length) { document.getElementById('tabErr').classList.add('show'); ok = false; }
    if (!addr) { addrEl.classList.add('error'); document.getElementById('addrErr').classList.add('show'); ok = false; }
    if (!ok) { msg('Fill in the required fields', true); return; }

    const lat = document.getElementById('latitude').value, lng = document.getElementById('longitude').value;
    const accuracy = document.getElementById('locationAccuracy').value;
    let total = 0;
    const list = ids.map((s, i) => {
      const c = calc(s, sel[s.id]); total += c.total;
      const detail = s.type === 'fix' ? `Visit/Inspection ${inr(c.total)} onwards` : `${c.label} - ${inr(c.total)}${c.plus ? ' onwards' : ''}${c.suffix}`;
      return `${i + 1}. ${s.full} (${detail})`;
    }).join('\n');
    const mapLink = lat && lng ? `https://www.google.com/maps?q=${lat},${lng}` : 'GPS location was not captured';

    const text =
      `*Service Booking Request*\n\n` +
      `*Services:*\n${list}\n\n` +
      `*Estimated total:* ${inr(total)} onwards\n_(Starting rates. Final price after site inspection.)_\n\n` +
      `*Address:*\n${addr}\n\n` +
      `*Customer GPS Location:*\n${mapLink}\n` +
      (lat && lng
        ? `*Coordinates:* ${lat}, ${lng}\n*Estimated accuracy:* ${accuracy} metres`
        : '*GPS coordinates were not captured. Please confirm the address with the customer.*');

    // WhatsApp opens with the message prefilled; the user must press Send.
    window.open(`https://wa.me/919793871934?text=${encodeURIComponent(text)}`, '_blank', 'noopener,noreferrer');
  }

  function msg(text, bad) {
    const el = document.getElementById('toast');
    el.textContent = text; el.className = 'toast' + (bad ? ' bad' : '');
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => el.classList.remove('show'), 3000);
  }

  document.getElementById('addr').addEventListener('input', function () {
    this.classList.remove('error'); document.getElementById('addrErr').classList.remove('show');
  });
  render();
</script>
</body>
</html>
